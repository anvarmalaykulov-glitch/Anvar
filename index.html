<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Anvar's Page</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
    text-align: center;
}

section {
    padding: 60px 20px;
}

h1 {
    font-size: 48px;
    margin-bottom: 20px;
}

h2 {
    margin-bottom: 30px;
    color: #38bdf8;
}

.avatar {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #38bdf8;
    box-shadow: 0 0 30px #38bdf8;
}

.name {
    font-size: 32px;
    margin-top: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    max-width: 900px;
    margin: auto;
}

.grid img {
    width: 100%;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(56,189,248,0.4);
    transition: transform 0.3s;
}

.grid img:hover {
    transform: scale(1.05);
}

.gif {
    width: 300px;
    border-radius: 20px;
    box-shadow: 0 0 25px #22c55e;
}

.music iframe {
    width: 100%;
    max-width: 560px;
    height: 315px;
    border-radius: 20px;
    margin: 20px auto;
    display: block;
}
</style>
</head>

<body>

<!-- HEADER -->
<section>
    <h1>Welcome to Anvar's Page</h1>
    <img src="https://github.com/user-attachments/assets/6155bbda-c5db-4463-beee-1a7af2f8156f"
    class="avatar"/>
    <div class="name">Anvar</div>
</section>

<!-- HOBBIES -->
<section>
    <h2>My Hobbies</h2>
    <p>🎮 Gaming | 🎌 Anime | 🎵 Music | 💻 Coding</p>
</section>

<!-- GAMES -->
<section>
    <h2>Favorite Games</h2>
    <div class="grid">
        <img
            src="https://github.com/user-attachments/assets/579007e4-8928-44d2-9138-e642aa616cb9"
            class="grid"
            />
        <img src="https://github.com/user-attachments/assets/4c3b3dbe-9f00-4960-ba9d-e8801868dd1b"
         class="grid"/>
        <img src="https://github.com/user-attachments/assets/4aa3718a-b787-4bd9-9caf-7e5b98db045a"
        class="grid"/>
    </div>
</section>

<!-- ANIME -->
<section>
    <h2>Favorite Anime</h2>
    <div class="grid">
        <img src="https://github.com/user-attachments/assets/19028b1d-d04b-4b74-b942-b9f6b912c3e8"
            class="grid"/>
        <img src="https://github.com/user-attachments/assets/6f490aac-c182-4dcf-8900-2d83f01b1cdb"
             class="grid"/>
        <img src="https://github.com/user-attachments/assets/64928f4f-4033-433e-888a-01ef31587ecb"
             class="grid"/>
    </div>
</section>

<!-- GIF -->
<section>
    <h2>Just a GIF 😎</h2>
    <img src="https://github.com/user-attachments/assets/df7b823e-8ebc-48c7-90e4-558af2137d91" 
        class="gif"/>
</section>

<!-- MUSIC -->
<section class="music">
    <h2>Recommended Music 🎧</h2>

    <iframe
  src="https://www.youtube.com/embed/fL1pnzQj5j8"
  allowfullscreen>
</iframe>
   src="https://www.youtube-nocookie.com/embed/fL1pnzQj5j8?si=wXWAAviWDijLbsDo"
    ></iframe>
    <iframe src="https://www.youtube.com/embed/VIDEO_ID_3" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/VIDEO_ID_4" allowfullscreen></iframe>
</section>

</body>
</html>
